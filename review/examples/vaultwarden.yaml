# Vaultwarden: an unofficial, lightweight server compatible with the Bitwarden
# password manager clients, written in Rust and run by self-hosters.
# Stage: growth. Illustrative only, written from public information; owners and
# targets are invented.
intentSpec: "0.1"
id: vaultwarden
version: 1.0.0
stage: ratified

products:
  vaultwarden:
    name: Vaultwarden
    description: Self-hosted Bitwarden-compatible server that runs on small hardware.
    targets: [keep-passwords-in-sync]
    selects: [vaultwarden-controls]

jobExecutors:
  self-hoster:
    description: Technically capable person running services at home for themselves and their family

jobs:
  keep-passwords-in-sync:
    statement: Keep my household's passwords available on every device without handing them to a third party
    motivates: self-hoster

outcomes:
  low-resources:
    in: keep-passwords-in-sync
    statement: Minimize the hardware needed to run the password server
  works-with-clients:
    in: keep-passwords-in-sync
    statement: Minimize the number of client features that don't work with my server
  server-breach-safe:
    in: keep-passwords-in-sync
    statement: Minimize the likelihood that a compromised server exposes readable passwords
  always-available:
    in: keep-passwords-in-sync
    statement: Minimize the time my family can't reach their passwords
  easy-upgrades:
    in: keep-passwords-in-sync
    statement: Minimize the effort to stay on a secure version
  enterprise-sso:
    in: keep-passwords-in-sync
    statement: Minimize the effort to sign in with my organisation's identity provider
    disposition: out-of-scope
    rationale: The project targets households and small groups

requirements:
  client-side-encryption:
    statement: The server stores and returns only vault data the clients encrypted; it never receives the master password or keys
    verification: Protocol review against the Bitwarden client; database inspection shows only ciphertext
    serves: [server-breach-safe]
  bitwarden-api-compat:
    statement: Implement the Bitwarden client API so official desktop, mobile, browser and CLI clients work unmodified
    verification: Manual test matrix against current official clients before each release
    serves: [works-with-clients]
  single-binary:
    statement: Ship as a single container image that runs with SQLite and under 100 MB of RAM
    verification: Memory measured on a reference Raspberry Pi
    serves: [low-resources, easy-upgrades]
  push-and-websocket-sync:
    statement: Clients learn about vault changes in near real time via WebSocket and the Bitwarden push relay
    verification: Two-client sync test
    serves: [always-available]
  login-rate-limit:
    statement: Login and admin endpoints are rate-limited per IP
    verification: Integration test exceeding the limit
    serves: [server-breach-safe]
    implements: [adopt-rate-limit]
  two-factor:
    statement: Users can require TOTP, WebAuthn or email two-factor login
    verification: Login tests for each method
    serves: [server-breach-safe]
  hashed-admin-token:
    statement: The admin token can be stored as an Argon2 hash, and the admin page can be disabled
    verification: Config test with hashed and absent tokens
    executes: [reduce-admin-takeover]
  icon-fetch-guard:
    statement: The icon service refuses to fetch from non-global IP addresses and can be disabled
    verification: Unit test with private and loopback addresses
    executes: [reduce-icon-ssrf]

metrics:
  idle-memory:
    target: Under 100 MB resident when idle
    frequency: Every release
    measures: [low-resources]
  advisory-response:
    target: Every security report acknowledged within 7 days
    frequency: Quarterly
    measures: [vulnerability-disclosure]

risks:
  icon-ssrf:
    description: An attacker makes the icon service request internal addresses on the self-hoster's network
    endangers: []
  admin-takeover:
    description: Someone guesses or steals the admin token and deletes or disables users
    endangers: [always-available]
  client-api-drift:
    description: Official clients change their API and break compatibility until Vaultwarden catches up
    endangers: [works-with-clients]
  maintainer-capacity:
    description: The project depends on a few volunteer maintainers, so fixes can be slow
    endangers: [easy-upgrades, works-with-clients]
  no-tls:
    description: A self-hoster runs the server without TLS, so traffic can be read or modified in transit
    endangers: []

treatments:
  reduce-icon-ssrf:
    strategy: reduce
    owner: Maintainers
    reviewBy: 2027-06-01
    treats: [icon-ssrf]
    scopes: [vaultwarden]
  reduce-admin-takeover:
    strategy: reduce
    owner: Maintainers
    reviewBy: 2027-06-01
    treats: [admin-takeover]
    scopes: [vaultwarden]
  accept-api-drift:
    strategy: accept
    owner: Maintainers
    reviewBy: 2027-01-01
    rationale: Following upstream is the project's core work; compatibility gaps are fixed as releases appear
    treats: [client-api-drift]
    scopes: [vaultwarden]
  accept-maintainer-capacity:
    strategy: accept
    owner: Maintainers
    reviewBy: 2027-01-01
    rationale: A volunteer project; self-hosters accept this when they choose it
    treats: [maintainer-capacity]
    scopes: [vaultwarden]
  transfer-tls:
    strategy: transfer
    owner: Maintainers
    rationale: The self-hoster terminates TLS; the setup guide requires a reverse proxy with HTTPS
    treats: [no-tls]
    scopes: [vaultwarden]

externalReferences:
  agpl: {title: GNU Affero General Public License v3, url: "https://www.gnu.org/licenses/agpl-3.0.html", party: Free Software Foundation}

influencers:
  inf-user-trust:
    kinds: [internal]
    scopeRationale: People store every credential they have in it; a breach would be catastrophic for them
  inf-agpl:
    kinds: [contractual]
    scopeRationale: The project is licensed under AGPLv3
    cites: agpl

policies:
  pol-security:
    statement: We keep users' vaults safe and fix security issues promptly
    name: Security policy (SECURITY.md)
    approver: Maintainers
    satisfies: [inf-user-trust]

controlObjectives:
  co-prevent-unauthorised-access:
    statement: Only the vault owner can sign in to their account
    supports: [pol-security]
  co-protect-in-transit:
    statement: Vault traffic cannot be read or altered in transit
    supports: [pol-security]
  co-fix-vulnerabilities:
    statement: Reported vulnerabilities are fixed before they are widely exploited
    supports: [pol-security]

standards:
  std-rate-limited-auth:
    statement: Authentication endpoints are rate-limited
    addresses: [co-prevent-unauthorised-access]
  std-tls-only:
    statement: Clients reach the server only over TLS
    addresses: [co-protect-in-transit]
  std-private-disclosure:
    statement: Vulnerabilities can be reported privately and are acknowledged within 7 days
    addresses: [co-fix-vulnerabilities]

guidelines:
  gl-reverse-proxy:
    description: Example reverse proxy configurations in the project wiki
    augments: [std-tls-only]

controls:
  rate-limiting:
    statement: Login and admin endpoints reject requests above a configured rate
    owner: Maintainers
    safeguard: technical
    enforces: [std-rate-limited-auth]
    achieves: [co-prevent-unauthorised-access]
  tls-termination:
    statement: The server is reachable only over TLS, terminated by a reverse proxy or by Rocket's built-in TLS
    owner: Maintainers
    safeguard: technical
    enforces: [std-tls-only]
    achieves: [co-protect-in-transit]
  vulnerability-disclosure:
    statement: Vulnerabilities are reported privately through GitHub security advisories and acknowledged within 7 days
    owner: Maintainers
    safeguard: administrative
    enforces: [std-private-disclosure]
    achieves: [co-fix-vulnerabilities]

procedures:
  proc-advisory-triage:
    steps: "1. Acknowledge the advisory within 7 days. 2. Reproduce and fix it privately. 3. Release the fix and publish the advisory."
    owner: Maintainers
    overseer: Maintainers
    operationalizes: vulnerability-disclosure
    implements: [adopt-disclosure]

assessmentObjectives:
  ao-rate-limit: {assesses: rate-limiting, verifies: [std-rate-limited-auth], methods: [test], evidence: "Repeated failed login attempts being throttled by the server"}
  ao-tls: {assesses: tls-termination, verifies: [std-tls-only], methods: [test], evidence: "TLS scan showing no plaintext HTTP endpoint serves vault data"}
  ao-disclosure: {assesses: vulnerability-disclosure, verifies: [std-private-disclosure], examines: [proc-advisory-triage], methods: [examine], evidence: "Private advisory history showing reports triaged before public disclosure"}

profiles:
  vaultwarden-controls:
    name: Vaultwarden control profile

selections:
  sel-rate-limiting: {in: vaultwarden-controls, choice: include, names: rate-limiting}
  sel-tls-termination: {in: vaultwarden-controls, choice: include, names: tls-termination}
  sel-vulnerability-disclosure: {in: vaultwarden-controls, choice: include, names: vulnerability-disclosure}

adoptions:
  adopt-rate-limit: {mode: system, adopts: rate-limiting, governs: vaultwarden, owner: Maintainers}
  adopt-tls: {mode: delegated, adopts: tls-termination, governs: vaultwarden, delegatedTo: Self-hoster, rationale: The self-hoster terminates TLS at their own reverse proxy}
  adopt-disclosure: {mode: procedure, adopts: vulnerability-disclosure, governs: vaultwarden, owner: Maintainers}

people:
  household-member: {name: Household member, description: Uses the Bitwarden apps to store and fill passwords}
  admin: {name: Server admin, description: The self-hoster managing users and settings, plays: [self-hoster]}

systems:
  vaultwarden-system:
    name: Vaultwarden
    description: Bitwarden-compatible server
    owner: Vaultwarden maintainers
    external: false
    realizes: [vaultwarden]
  bitwarden-clients: {name: Bitwarden clients, description: Official desktop, mobile, browser and CLI apps, owner: Bitwarden Inc., external: true}
  push-relay: {name: Bitwarden push relay, description: Forwards push notifications to mobile apps, owner: Bitwarden Inc., external: true}
  smtp-server: {name: SMTP server, description: Sends invitations and two-factor codes, owner: Self-hoster's provider, external: true}
  websites: {name: Websites, description: Sites whose icons are fetched, owner: Anyone, external: true}

containers:
  api-server:
    in: vaultwarden-system
    name: API server
    description: Implements the Bitwarden API, admin page, notifications and icon service
    kind: application
    technology: Rust
    satisfies: [bitwarden-api-compat, single-binary, push-and-websocket-sync, login-rate-limit, two-factor, hashed-admin-token]
  web-vault:
    in: vaultwarden-system
    name: Web vault
    description: Bitwarden web client build served by the API server, runs in the browser
    kind: application
    technology: Angular
  database:
    in: vaultwarden-system
    name: Database
    description: Users, organisations and encrypted vault items
    kind: data-store
    technology: SQLite, MySQL or PostgreSQL
  attachments:
    in: vaultwarden-system
    name: Attachments and icon cache
    description: Encrypted attachments, sends and cached icons on disk
    kind: data-store
    technology: File system

components:
  identity: {in: api-server, name: Identity, description: Login, two-factor and tokens, technology: Rust}
  vault-api: {in: api-server, name: Vault API, description: Sync and cipher endpoints, technology: Rust, satisfies: [client-side-encryption]}
  admin-page: {in: api-server, name: Admin page, description: User and settings management behind the admin token, technology: Rust}
  icon-service: {in: api-server, name: Icon service, description: Fetches and caches website icons, technology: Rust, satisfies: [icon-fetch-guard]}
  notifications: {in: api-server, name: Notifications, description: WebSocket hub and push relay client, technology: Rust}

relationships:
  member-uses-clients: {leaves: household-member, enters: bitwarden-clients, description: Stores and fills passwords}
  clients-sync: {leaves: bitwarden-clients, enters: api-server, description: Logs in and syncs encrypted vault items, technology: HTTPS, WebSocket}
  admin-manages: {leaves: admin, enters: api-server, description: Manages users and settings on the admin page, technology: HTTPS}
  member-uses-web-vault: {leaves: household-member, enters: web-vault, description: Manages the vault in a browser}
  web-vault-calls-api: {leaves: web-vault, enters: api-server, description: Logs in and syncs encrypted vault items, technology: HTTPS}
  api-uses-db: {leaves: api-server, enters: database, description: Reads and writes users and ciphertext, technology: Diesel/SQL}
  api-uses-files: {leaves: api-server, enters: attachments, description: Reads and writes attachments and icons, technology: File I/O}
  api-pushes: {leaves: api-server, enters: push-relay, description: Sends sync notifications for mobile apps, technology: HTTPS}
  api-sends-mail: {leaves: api-server, enters: smtp-server, description: Sends invitations and two-factor codes, technology: SMTP}
  api-fetches-icons: {leaves: api-server, enters: websites, description: Fetches site icons, technology: HTTPS}
  clients-log-in: {leaves: bitwarden-clients, enters: identity, description: Logs in and refreshes tokens, technology: HTTPS}
  clients-sync-ciphers: {leaves: bitwarden-clients, enters: vault-api, description: Syncs encrypted vault items, technology: HTTPS}
  clients-subscribe: {leaves: bitwarden-clients, enters: notifications, description: Subscribes to sync notifications, technology: WebSocket}
  clients-get-icons: {leaves: bitwarden-clients, enters: icon-service, description: Gets site icons, technology: HTTPS}
  admin-uses-admin-page: {leaves: admin, enters: admin-page, description: Manages users and settings, technology: HTTPS}
  web-vault-logs-in: {leaves: web-vault, enters: identity, description: Logs in and refreshes tokens, technology: HTTPS}
  web-vault-syncs-ciphers: {leaves: web-vault, enters: vault-api, description: Syncs encrypted vault items, technology: HTTPS}
  vault-api-notifies: {leaves: vault-api, enters: notifications, description: Announces vault changes}
  identity-uses-db: {leaves: identity, enters: database, description: Reads users and stores tokens, technology: Diesel/SQL}
  vault-api-uses-db: {leaves: vault-api, enters: database, description: Reads and writes ciphertext, technology: Diesel/SQL}
  admin-page-uses-db: {leaves: admin-page, enters: database, description: Reads and writes users and settings, technology: Diesel/SQL}
  vault-api-uses-files: {leaves: vault-api, enters: attachments, description: Reads and writes encrypted attachments, technology: File I/O}
  icon-service-caches: {leaves: icon-service, enters: attachments, description: Caches icons, technology: File I/O}
  notifications-push: {leaves: notifications, enters: push-relay, description: Sends sync notifications for mobile apps, technology: HTTPS}
  identity-sends-codes: {leaves: identity, enters: smtp-server, description: Sends two-factor codes, technology: SMTP}
  admin-page-invites: {leaves: admin-page, enters: smtp-server, description: Sends invitations, technology: SMTP}
  icon-service-fetches: {leaves: icon-service, enters: websites, description: Fetches site icons, technology: HTTPS}

dynamicDiagrams:
  dyn-sync:
    name: Saving a new login on one device appears on another
    illustrates: push-and-websocket-sync
    depicts: vaultwarden-system

dynamicSteps:
  dyn-sync-1: {in: dyn-sync, order: 1, follows: clients-sync, description: Client uploads the encrypted item}
  dyn-sync-2: {in: dyn-sync, order: 2, follows: api-uses-db, description: Server stores the ciphertext}
  dyn-sync-3: {in: dyn-sync, order: 3, follows: api-pushes, description: Server notifies mobile clients via the push relay}
  dyn-sync-4: {in: dyn-sync, order: 4, follows: clients-sync, description: Other clients fetch the change}

environments:
  home-install: {name: Typical home install, serves: [vaultwarden], operator: Self-hosting operator}

deploymentNodes:
  home-server:
    name: Home server
    technology: Linux, Docker
    belongs: home-install

containerInstances:
  api-server-instance: {in: home-server, instantiates: api-server}
  database-instance: {in: home-server, instantiates: database}
  attachments-instance: {in: home-server, instantiates: attachments}

infrastructureNodes:
  reverse-proxy: {in: home-server, name: Reverse proxy, technology: Caddy or nginx with TLS}

deploymentDiagrams:
  deploy-home:
    depicts: [vaultwarden-system]
    covers: home-install
    notDeployed:
      web-vault: Served by the API server and runs in the member's browser

externalEntities:
  ee-clients: {label: Bitwarden clients, represents: bitwarden-clients}
  ee-admin: {label: Admin, represents: admin}
  ee-member: {label: Household member, represents: household-member}
  ee-push-relay: {label: Push relay, represents: push-relay}
  ee-smtp: {label: SMTP server, represents: smtp-server}
  ee-websites: {label: Websites, represents: websites}

processes:
  p-api: {label: API server, represents: api-server}
  p-web-vault: {label: Web vault, represents: web-vault}

dataStores:
  ds-database: {label: Database, represents: database, stores: [vault-ciphertext, user-account, admin-settings]}
  ds-files: {label: Attachments and icons, represents: attachments, stores: [vault-ciphertext, icon]}

dataElements:
  vault-ciphertext: {classification: restricted, description: Encrypted vault items and attachments}
  user-account: {classification: confidential, description: Email, master password hash, two-factor secrets}
  admin-settings: {classification: confidential, description: Server configuration including SMTP credentials}
  icon: {classification: public, description: Cached website icon}
  notification: {classification: internal, description: Device token and "vault changed" signal}
  email-message: {classification: confidential, description: Invitation or two-factor code}

dataFlows:
  df-clients-api: {label: Vault sync, connects: [ee-clients, p-api], leaves: ee-clients, carries: [vault-ciphertext, user-account], represents: [clients-sync]}
  df-admin-api: {label: Admin page, connects: [ee-admin, p-api], leaves: ee-admin, carries: [admin-settings, user-account], represents: [admin-manages]}
  df-member-web-vault: {label: Browser session, connects: [ee-member, p-web-vault], leaves: ee-member, carries: [vault-ciphertext], represents: [member-uses-web-vault]}
  df-web-vault-api: {label: Vault sync, connects: [p-web-vault, p-api], leaves: p-web-vault, carries: [vault-ciphertext, user-account], represents: [web-vault-calls-api]}
  df-api-db: {label: SQL, connects: [p-api, ds-database], leaves: p-api, carries: [vault-ciphertext, user-account, admin-settings], represents: [api-uses-db]}
  df-api-files: {label: File I/O, connects: [p-api, ds-files], leaves: p-api, carries: [vault-ciphertext, icon], represents: [api-uses-files]}
  df-api-push: {label: Push, connects: [p-api, ee-push-relay], leaves: p-api, carries: [notification], represents: [api-pushes]}
  df-api-smtp: {label: Mail, connects: [p-api, ee-smtp], leaves: p-api, carries: [email-message], represents: [api-sends-mail]}
  df-api-websites: {label: Icon fetch, connects: [p-api, ee-websites], leaves: p-api, carries: [icon], represents: [api-fetches-icons]}

trustBoundaries:
  tb-server:
    label: Home server
    crossing: HTTPS through the reverse proxy; outbound HTTPS and SMTP from the API server
    encloses: [p-api, ds-database, ds-files]
    relies: [reverse-proxy, tls-termination]

dataFlowDiagrams:
  dfd-vaultwarden:
    level: detail
    depicts: vaultwarden-system
    includes: [ee-clients, ee-admin, ee-member, ee-push-relay, ee-smtp, ee-websites, p-api, p-web-vault, ds-database, ds-files]

threats:
  t-store-disclosure:
    category: information-disclosure
    appliesTo: [data-store]
    description: Someone with access to the server's disk or backups reads vault data
  t-server-side-request:
    category: information-disclosure
    appliesTo: [process]
    description: A process is tricked into making requests that reveal internal resources
  t-spoofed-party:
    category: spoofing
    appliesTo: [external-entity]
    description: Someone impersonates a user, admin or external service
    threatens: [rate-limiting]
  t-flow-tampering:
    category: tampering
    appliesTo: [data-flow]
    description: Data is modified in transit
    threatens: [tls-termination]

threatReviews:
  r-store-db: {reviews: t-store-disclosure, inspects: [ds-database], disposition: covered, cites: [client-side-encryption]}
  r-store-files: {reviews: t-store-disclosure, inspects: [ds-files], disposition: covered, cites: [client-side-encryption]}
  r-ssrf-api: {reviews: t-server-side-request, inspects: [p-api], disposition: risk, raises: icon-ssrf}
  r-ssrf-web-vault: {reviews: t-server-side-request, inspects: [p-web-vault], disposition: not-applicable, rationale: Runs in the user's browser and makes no server-side requests}
  r-spoof-clients: {reviews: t-spoofed-party, inspects: [ee-clients], disposition: covered, cites: [rate-limiting, two-factor]}
  r-spoof-admin: {reviews: t-spoofed-party, inspects: [ee-admin], disposition: risk, raises: admin-takeover}
  r-spoof-member: {reviews: t-spoofed-party, inspects: [ee-member], disposition: covered, cites: [rate-limiting, two-factor]}
  r-spoof-push: {reviews: t-spoofed-party, inspects: [ee-push-relay], disposition: not-applicable, rationale: The server only sends to the relay; a spoofed relay learns only that a vault changed}
  r-spoof-smtp: {reviews: t-spoofed-party, inspects: [ee-smtp], disposition: not-applicable, rationale: The server only sends mail and accepts none}
  r-spoof-websites: {reviews: t-spoofed-party, inspects: [ee-websites], disposition: not-applicable, rationale: Fetched icons are images shown to the user; they carry no authority}
  r-tamper-clients: {reviews: t-flow-tampering, inspects: [df-clients-api], disposition: risk, raises: no-tls}
  r-tamper-admin: {reviews: t-flow-tampering, inspects: [df-admin-api], disposition: risk, raises: no-tls}
  r-tamper-member: {reviews: t-flow-tampering, inspects: [df-member-web-vault], disposition: not-applicable, rationale: Interaction inside the user's own browser}
  r-tamper-web-vault: {reviews: t-flow-tampering, inspects: [df-web-vault-api], disposition: risk, raises: no-tls}
  r-tamper-db: {reviews: t-flow-tampering, inspects: [df-api-db], disposition: not-applicable, rationale: Local socket or file on the same host}
  r-tamper-files: {reviews: t-flow-tampering, inspects: [df-api-files], disposition: not-applicable, rationale: Local file system on the same host}
  r-tamper-push: {reviews: t-flow-tampering, inspects: [df-api-push], disposition: risk, raises: no-tls}
  r-tamper-smtp: {reviews: t-flow-tampering, inspects: [df-api-smtp], disposition: risk, raises: no-tls}
  r-tamper-websites: {reviews: t-flow-tampering, inspects: [df-api-websites], disposition: covered, cites: [icon-fetch-guard]}

# Couldn't express
# - Backups. The biggest real availability risk is a self-hoster losing their
#   database. That's entirely the operator's job, and there's no place to say "this
#   product depends on the operator doing X".
# - Configuration options that change the security posture: disabling the admin
#   page, disabling the icon service, enabling sign-ups. Requirements mention
#   them, but I can't model a deployment choice and its effect.
# - That the client is the security boundary. client-side-encryption is the key
#   requirement, yet it's satisfied by Bitwarden's clients, which are an external
#   system. I attached it to the vault API component instead.
# - The icon SSRF risk endangers the self-hoster's home network, not an outcome
#   of the job, so `endangers` is empty.
# - The policy approver must be "executive leadership". A volunteer project has
#   maintainers.
# - Risks of the project itself (bus factor, upstream API drift) sit alongside
#   security risks with no way to tell them apart.
# - Per-element threats are expensive: one spoofing threat across six external
#   entities, plus one tampering threat across nine flows, needed 15 reviews, most
#   of them obvious.
# - No threat threatens client-side-encryption, because `threatens` targets
#   controls only and this is a requirement.
# - Likelihood or impact for any risk.
