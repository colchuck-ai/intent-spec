# Couldn't express
# - HIPAA applies to the clinic, not to OpenEMR. The whole security program exists
#   to let covered entities comply, but the influencer's scope rationale is the only
#   place to say so. There's no way to express "we provide this control so that
#   our customers can meet their obligation".
# - Certification status. OpenEMR holds a specific ONC certification with a
#   listing number and date. A control objective can name the criteria it answers
#   in clauses, but the certification itself has nowhere to go.
# - The deploying practice's shared responsibility. It's spread across inherited
#   adoptions, a transfer treatment and free-text owners. A clinic reading this
#   can't easily get "what you must do yourself" out of it.
# - Patient-chosen SMART apps receive ePHI but aren't business associates, so no
#   BAA binds them. GRC-25 still warns, and there's no way to record why.
# - Configuration that changes compliance. Document encryption is optional, and
#   MFA is available but not enforced by default on self-installs. The system
#   adoption claims the control, but whether a given clinic has it switched on is
#   deployment state, which is out of scope.
# - cloud-tls is satisfied by the AWS load balancer, an infrastructure node.
#   Those can't satisfy requirements, so I attached it to the whole system.
# - The ACL-misconfiguration risk is caused by the clinic, not an attacker, but it
#   could only be raised through an elevation-of-privilege review.
# - The excepted MFA adoption needed an accept treatment that waives std-mfa. It
#   works, but the risk "MFA isn't enforced" restates the exception rather than a
#   real cause and consequence.
# - The unpatched-installs risk endangers patients' safety and privacy, not an
#   outcome of any job in this document.
# - Clinical safety risks, such as a wrong medication from a data error, have no
#   home. RISK only endangers outcomes, and patient harm isn't an outcome of
#   these jobs.
# - 14 threat reviews cover 29 (threat, target) pairs on a deliberately small DFD,
#   one review per decision. A real deployment would still need many more.
# - The project's governance: OpenEMR Foundation, volunteer contributors and
#   commercial support vendors who each deploy it differently.
